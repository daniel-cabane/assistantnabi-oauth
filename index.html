<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nabi is a friendly AI assistant that helps you get things done.">
  <title>Nabi - Your AI Assistant</title>
  <style>
    :root {
      --navy: #19284d;
      --blue: #5865f2;
      --soft-blue: #eef1ff;
      --text: #26324a;
      --muted: #69748a;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.6;
    }

    header {
      border-bottom: 1px solid #edf0f5;
      background: rgba(255, 255, 255, 0.96);
    }

    nav {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      color: var(--navy);
      font-size: 24px;
      font-weight: 800;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 22px;
    }

    .nav-links a,
    footer a {
      color: var(--muted);
      text-decoration: none;
    }

    .nav-links a:hover,
    footer a:hover {
      color: var(--blue);
    }

    main {
      min-height: calc(100vh - 140px);
      display: grid;
      place-items: center;
      padding: 64px 24px;
    }

    .hero {
      max-width: 760px;
      text-align: center;
    }

    .logo-mark {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: var(--soft-blue);
      color: var(--blue);
      font-size: 42px;
      font-weight: 800;
      box-shadow: 0 14px 35px rgba(88, 101, 242, 0.12);
    }

    h1 {
      margin: 0 0 16px;
      color: var(--navy);
      font-size: clamp(42px, 8vw, 72px);
      line-height: 1.05;
    }

    .tagline {
      margin: 0 auto 32px;
      max-width: 620px;
      color: var(--muted);
      font-size: clamp(18px, 3vw, 22px);
    }

    .cta {
      display: inline-block;
      border-radius: 10px;
      padding: 14px 24px;
      background: var(--blue);
      color: var(--white);
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 24px rgba(88, 101, 242, 0.24);
    }

    .cta:hover {
      background: #4654df;
    }

    footer {
      border-top: 1px solid #edf0f5;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    footer a {
      margin: 0 8px;
    }

    @media (max-width: 600px) {
      nav {
        align-items: flex-start;
        gap: 12px;
      }

      .nav-links {
        flex-direction: column;
        gap: 4px;
        text-align: right;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a class="brand" href="index.html">Nabi</a>
      <div class="nav-links">
        <a href="termsofservice.html">Terms</a>
        <a href="privacypolicy.html">Privacy</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="logo-mark" aria-hidden="true">N</div>
      <h1 id="hero-title">Meet Nabi</h1>
      <p class="tagline">
        A friendly AI assistant designed to answer questions, organize ideas,
        and help you move forward with confidence.
      </p>
      <a class="cta" href="mailto:hello@nabi.example">Get in touch</a>
    </section>
  </main>

  <footer>
    <span>&copy; 2026 Nabi. All rights reserved.</span>
    <nav aria-label="Legal navigation">
      <a href="termsofservice.html">Terms of Service</a>
      <a href="privacypolicy.html">Privacy Policy</a>
    </nav>
  </footer>
</body>
</html>
